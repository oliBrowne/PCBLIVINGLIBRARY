name: Unofficial sources check

# EasyEDA's component endpoint and JLCPCB's part search are undocumented, so they can change without notice.
# Every Monday this asks them about a few known parts and checks that ecadlib still reads the answers correctly.
# A red run means a source changed: the raw answers are kept as an artifact for updating the converter.
on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -e .
      - run: python -m ecadlib sources-check --save sources-check
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sources-check-answers
          path: sources-check/
          retention-days: 30
