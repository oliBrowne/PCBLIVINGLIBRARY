name: tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - name: pdftoppm for the visual-check tests
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends poppler-utils
      - name: Run all tests (offline; no secrets needed)
        env:
          SOURCE_DATE_EPOCH: "1791936000"
        run: python -m tests.run_all

  accuracy-gate:
    # ecadlib eval gate: the 331-case eval set offline (standard parts + the committed synthetic replay pack, no network,
    # no keys) against ecadlib/eval/baselines/kicad-v1.json. Fails when a family's pass rate drops more than 1 % or a
    # passing case breaks. A deliberate change: `python -m ecadlib eval gate --update` and commit the baseline diff.
    # (The golden output snapshots run in the test job: tests/test_evalgate.py.)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - name: Accuracy gate (offline)
        run: python -m ecadlib eval gate -o out/eval/gate
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: eval-gate-report-${{ matrix.python }}
          path: out/eval/gate/report.md

  kicad:
    # Optional: the tests that need real KiCad (tests/test_kicad_real.py, and kicad_export's kicad-cli check). They skip
    # in the job above. Ubuntu's kicad package is KiCad 7; the PPA row runs them on KiCad 8 (the export's own format).
    runs-on: ubuntu-24.04
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        kicad: ["ubuntu", "ppa:kicad/kicad-8.0-releases"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - name: Install KiCad (kicad-cli, and pcbnew for the system Python)
        run: |
          if [ "${{ matrix.kicad }}" != "ubuntu" ]; then sudo add-apt-repository -y "${{ matrix.kicad }}"; fi
          sudo apt-get update && sudo apt-get install -y --no-install-recommends kicad
          kicad-cli version && /usr/bin/python3 -c "import pcbnew; print(pcbnew.Version())"
      - name: Run the real-KiCad tests
        run: python -m tests.run_all test_kicad_real test_kicad_export test_tool_packages test_e2e test_testpack

  package:
    # Build the sdist and wheel the release workflow would publish, then install each into a
    # clean venv and smoke-test it from outside the checkout (catches missing package data).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - name: Smoke-test the installed wheel and sdist
        run: |
          for dist in dist/*.whl dist/*.tar.gz; do
            echo "::group::$dist"
            rm -rf /tmp/venv && python -m venv /tmp/venv
            /tmp/venv/bin/pip install -q "$dist"
            (cd /tmp && /tmp/venv/bin/python "$GITHUB_WORKSPACE/.github/scripts/smoke_installed.py")
            echo "::endgroup::"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
