name: weekly snapshot

# Every week the whole store (store.json, index/, parts/, withdrawn.json) is zipped as snapshot.zip and attached to the
# rolling release "snapshot", for `[store] mode = "snapshot"` and offline networks:
#   https://github.com/OWNER/REPO/releases/download/snapshot/snapshot.zip
on:
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade ecadlib
      - uses: actions/checkout@v4
        with:
          path: store
          persist-credentials: false
      - run: ecadlib store-repo snapshot store -o snapshot.zip
      - name: Attach to the rolling release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view snapshot >/dev/null 2>&1 || gh release create snapshot --title "Store snapshot" \
            --notes "The whole store as one zip, rebuilt every week. For offline use: [store] mode = \"snapshot\"."
          gh release upload snapshot snapshot.zip --clobber
