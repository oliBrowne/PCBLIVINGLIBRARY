name: verify

# Every pull request: the changed records are rebuilt from the record alone with the newest released ecadlib and must
# pass its release check, match their hashes and only add evidence (ecadlib store-repo verify). No AI, no secrets.
# Safe for pull requests from forks: the `pull_request` event (not the one that runs with write access), a read-only
# token, ecadlib installed from PyPI before the pull request's files are checked out, and nothing in the checkout is
# ever run.
on:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install ecadlib from PyPI (before the checkout, so no file of the pull request is on the path)
        run: python -m pip install --upgrade ecadlib
      - uses: actions/checkout@v4
        with:
          path: store
          fetch-depth: 0
          persist-credentials: false
      - name: Check the changed records
        env:
          BASE_REF: ${{ github.base_ref }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
        run: ecadlib store-repo verify store --base "origin/$BASE_REF" --author "$AUTHOR"
