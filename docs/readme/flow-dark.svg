<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 318" width="960" height="318" role="img" aria-label="BOM to library: read the BOM, find the part, draw the rest, check every part, release. Parts in doubt are held for a person, then signed off into the release."><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9198a1"/></marker></defs><rect x="20" y="20" width="160" height="128" rx="10" fill="#0d1117" stroke="#3d444d" stroke-width="1.5"/><text x="36" y="48" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="12" font-weight="400" fill="#9198a1" text-anchor="start">01</text><text x="36" y="72" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#ececf0" text-anchor="start">Read the BOM</text><text x="36" y="98" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#9198a1" text-anchor="start">Altium, ActiveBOM,</text><text x="36" y="115" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#9198a1" text-anchor="start">KiCad, CSV or XLSX</text><path d="M183 84.0L207 84.0" stroke="#9198a1" stroke-width="1.6" fill="none" marker-end="url(#a)"/><rect x="210" y="20" width="160" height="128" rx="10" fill="#0d1117" stroke="#3d444d" stroke-width="1.5"/><text x="226" y="48" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="12" font-weight="400" fill="#9198a1" text-anchor="start">02</text><text x="226" y="72" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#ececf0" text-anchor="start">Find the part</text><text x="226" y="98" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#9198a1" text-anchor="start">your libraries, KiCad</text><text x="226" y="115" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#9198a1" text-anchor="start">libraries, Nexar,</text><text x="226" y="132" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#9198a1" text-anchor="start">DigiKey, Mouser</text><path d="M373 84.0L397 84.0" stroke="#9198a1" stroke-width="1.6" fill="none" marker-end="url(#a)"/><rect x="400" y="20" width="160" height="128" rx="10" fill="#0d1117" stroke="#3d444d" stroke-width="1.5"/><text x="416" y="48" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="12" font-weight="400" fill="#9198a1" text-anchor="start">03</text><text x="416" y="72" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#ececf0" text-anchor="start">Draw the rest</text><text x="416" y="98" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#9198a1" text-anchor="start">a model reads the</text><text x="416" y="115" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#9198a1" text-anchor="start">datasheet, code draws</text><text x="416" y="132" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#9198a1" text-anchor="start">IPC-7351B pads</text><path d="M563 84.0L587 84.0" stroke="#9198a1" stroke-width="1.6" fill="none" marker-end="url(#a)"/><rect x="590" y="20" width="160" height="128" rx="10" fill="#0d1117" stroke="#e8834a" stroke-width="2"/><text x="606" y="48" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="12" font-weight="400" fill="#e8834a" text-anchor="start">04</text><text x="606" y="72" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#ececf0" text-anchor="start">Check every part</text><text x="606" y="98" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#9198a1" text-anchor="start">pins match pads, rules,</text><text x="606" y="115" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#9198a1" text-anchor="start">3D height, fields,</text><text x="606" y="132" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#9198a1" text-anchor="start">house style</text><path d="M753 84.0L777 84.0" stroke="#9198a1" stroke-width="1.6" fill="none" marker-end="url(#a)"/><rect x="780" y="20" width="160" height="128" rx="10" fill="#0d1117" stroke="#3d444d" stroke-width="1.5"/><text x="796" y="48" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="12" font-weight="400" fill="#9198a1" text-anchor="start">05</text><text x="796" y="72" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#ececf0" text-anchor="start">Release</text><text x="796" y="98" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#9198a1" text-anchor="start">Altium 365, SchLib,</text><text x="796" y="115" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#9198a1" text-anchor="start">PcbLib, DbLib or</text><text x="796" y="132" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#9198a1" text-anchor="start">KiCad libraries</text><circle cx="920" cy="67" r="5" fill="#3fb950"/><path d="M670.0 151L670.0 205" stroke="#9198a1" stroke-width="1.6" fill="none" marker-end="url(#a)"/><text x="678.0" y="183" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="12" font-weight="400" fill="#9198a1" text-anchor="start">in doubt</text><rect x="570" y="208" width="200" height="92" rx="10" fill="#1c2128" stroke="#3d444d" stroke-width="1.5" stroke-dasharray="5 4"/><circle cx="592" cy="235" r="5" fill="#d29922"/><text x="606" y="240" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#ececf0" text-anchor="start">Held for a person</text><text x="586" y="266" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#9198a1" text-anchor="start">why it is held, and the</text><text x="586" y="283" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#9198a1" text-anchor="start">next step, in plain words</text><path d="M773 254.0H860.0V152" stroke="#9198a1" stroke-width="1.6" fill="none" stroke-dasharray="5 5" marker-end="url(#a)"/><text x="870.0" y="244.0" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="12" font-weight="400" fill="#9198a1" text-anchor="start">signed off</text><text x="20" y="240" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#ececf0" text-anchor="start">Released parts stay put:</text><text x="20" y="260" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#9198a1" text-anchor="start">a library update that changes pins,</text><text x="20" y="277" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#9198a1" text-anchor="start">pads or identity waits for a person.</text></svg>
